# version: '3.9'

services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    #command: bash -c "RAILS_ENV=production bundle exec rails db:create db:migrate && RAILS_ENV=production bundle exec rails s -b 0.0.0.0 -p 8080"
    command: bash -c "RAILS_ENV=production bundle exec rails s -b 0.0.0.0 -p 8080"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      TZ: Asia/Tokyo
    depends_on:
      - db
    user: root

  db:
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp_production
    ports:
      - "5432:5432"

volumes:
  db_data: