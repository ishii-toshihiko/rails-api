# version: '3.9'

services:
  web:
    env_file:
      - /home/ishii/secret/rails-api/.env.development
    build:
      context: ./
      dockerfile: Dockerfile.dev
    command: >
      bash -c "cd /app &&
          rm -f tmp/pids/server.pid && rdbg -n --open --host 0.0.0.0 --port 1234 -c -- bundle exec rails s -p 3000 -b '0.0.0.0'"
    ports:
      - "3000:3000"
      - "1234:1234"
    volumes:
      - .:/app
    environment:
      RUBY_DEBUG_LOCAL_FS_MAP: "/app:/home/ishii/project/rails-api"
      TZ: Asia/Tokyo
    depends_on:
      - db
    user: root

  db:
    env_file:
      - /home/ishii/secret/rails-api/.env.development
    image: postgres:15
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data: