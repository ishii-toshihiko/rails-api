name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          gcloud run deploy rails-api \
            --image=$IMAGE \
            --region=asia-northeast1 \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --network-tags=cloudrun-rails-api \
            --max-instances=10 \
            --min-instances=0 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="RAILS_ENV=production,SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE }},POSTGRES_HOST=${{ secrets.POSTGRES_HOST }},POSTGRES_PORT=5432,POSTGRES_DB=${{ secrets.POSTGRES_DB }},POSTGRES_USER=${{ secrets.POSTGRES_USER }},RAILS_MAX_THREADS=5,POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            --project="${{ secrets.GCP_PROJECT_ID }}"
