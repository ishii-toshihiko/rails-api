# main ブランチへの push 時に Cloud Run へデプロイする
# 流れ: RuboCop / RSpec → 認証 → イメージ build/push → Secret 同期 → Service デプロイ → DB prepare Job
name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  # --- RuboCop（デプロイ前ゲート） ---
  rubocop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Run RuboCop
        run: bin/rubocop

  # --- RSpec（デプロイ前ゲート） ---
  rspec:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rails_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      CI: true
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rails_api_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true

      - name: Prepare test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

  build-and-deploy:
    needs: [rubocop, rspec]
    runs-on: ubuntu-latest

    steps:
      # リポジトリのソースを runner に取得
      - name: Checkout
        uses: actions/checkout@v5

      # --- GCP 認証・CLI セットアップ ---
      # GitHub Secrets の SA キーで認証し、gcloud / docker push を Artifact Registry 向けに設定
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      # --- Docker イメージ build / push ---
      # Artifact Registry (asia-northeast1) に rails-api/rails-api:latest を登録
      - name: Build and Push Docker image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      # --- Secret Manager 同期 ---
      # GitHub Secrets の値を GCP Secret Manager に作成または新版追加
      # 続けて Cloud Run 実行 SA に secretAccessor を付与（失敗時は warning のみ）
      - name: Upsert Secret Manager secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          upsert_secret() {
            local name="$1"
            local value="$2"
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" \
                --data-file=- \
                --project="$GCP_PROJECT_ID"
            else
              printf '%s' "$value" | gcloud secrets create "$name" \
                --data-file=- \
                --replication-policy=automatic \
                --project="$GCP_PROJECT_ID"
            fi
          }

          for name in SECRET_KEY_BASE POSTGRES_HOST POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            upsert_secret "$name" "${!name}"
          done

          # setIamPolicy は Secret Admin 等が必要。権限が無い場合はスキップする。
          # 初回はプロジェクト Owner が実行 SA に secretAccessor を付与すること。
          RUNTIME_SA="$(gcloud config get-value account)"
          if [[ -z "$RUNTIME_SA" || "$RUNTIME_SA" == "(unset)" ]]; then
            echo "Could not resolve runtime service account from gcloud auth" >&2
            exit 1
          fi

          for name in SECRET_KEY_BASE POSTGRES_HOST POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            if ! gcloud secrets add-iam-policy-binding "$name" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --project="$GCP_PROJECT_ID" \
              --quiet; then
              echo "::warning::Failed to bind secretAccessor on $name for $RUNTIME_SA. Grant it once as project Owner if Cloud Run cannot read secrets."
            fi
          done

      # --- Cloud Run Service デプロイ ---
      # Neon（パブリック Postgres）へ SSL 接続（POSTGRES_SSLMODE=require）
      # 機密値は --set-secrets、それ以外は --set-env-vars
      - name: Deploy to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          # 機密値は Secret Manager から環境変数注入（--set-secrets）
          gcloud run deploy rails-api \
            --image=$IMAGE \
            --region=asia-northeast1 \
            --max-instances=10 \
            --min-instances=0 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="RAILS_ENV=production,POSTGRES_PORT=5432,POSTGRES_SSLMODE=require,RAILS_MAX_THREADS=5" \
            --set-secrets="SECRET_KEY_BASE=SECRET_KEY_BASE:latest,POSTGRES_HOST=POSTGRES_HOST:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      # --- Cloud Run Job: db:prepare ---
      # Service デプロイ後に migration / DB 初期化を1回実行（--wait で完了待ち）
      - name: Run database prepare
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          # Job 定義の作成・更新
          # 機密値は Secret Manager から環境変数注入（--set-secrets）
          gcloud run jobs deploy rails-api-prepare \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --command=bundle \
            --args=exec,rails,db:prepare \
            --set-env-vars="RAILS_ENV=production,POSTGRES_PORT=5432,POSTGRES_SSLMODE=require,RAILS_MAX_THREADS=5" \
            --set-secrets="SECRET_KEY_BASE=SECRET_KEY_BASE:latest,POSTGRES_HOST=POSTGRES_HOST:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --tasks=1 \
            --max-retries=1 \
            --project="${{ secrets.GCP_PROJECT_ID }}"

          # 実行して db:prepare が成功するまで待機
          gcloud run jobs execute rails-api-prepare \
            --region=asia-northeast1 \
            --wait \
            --project="${{ secrets.GCP_PROJECT_ID }}"
