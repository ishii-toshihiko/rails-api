   name: Deploy to Cloud Run

   on:
     push:
       branches:
         - main

   jobs:
     build-and-deploy:
       runs-on: ubuntu-latest

       steps:
         - name: Checkout
           uses: actions/checkout@v3

         - name: Auth to Google Cloud
           uses: google-github-actions/auth@v2
           with:
             credentials_json: ${{ secrets.GCP_SA_KEY }}

         - name: Set up Cloud SDK
           uses: google-github-actions/setup-gcloud@v2
           with:
            project_id: ${{ secrets.GCP_PROJECT_ID }}

         - name: Configure Docker
           run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

         - name: Build and Push Docker image
           env:
            IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/rails-api:latest
           run: |
             docker build -t $IMAGE .
             docker push $IMAGE

         - name: Deploy to Cloud Run
           env:
            IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/backend/rails-api:latest
           run: |
             gcloud run deploy rails-api \
               --image=$IMAGE \
               --region=asia-northeast1 \
               --add-cloudsql-instances ishii-worksit-project:asia-northeast1:my-postgres \
               --set-secrets RAILS_MASTER_KEY=rails-master-key:latest \
               --allow-unauthenticated