name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and Push Docker image
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Upsert Secret Manager secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          upsert_secret() {
            local name="$1"
            local value="$2"
            if gcloud secrets describe "$name" --project="$GCP_PROJECT_ID" >/dev/null 2>&1; then
              printf '%s' "$value" | gcloud secrets versions add "$name" \
                --data-file=- \
                --project="$GCP_PROJECT_ID"
            else
              printf '%s' "$value" | gcloud secrets create "$name" \
                --data-file=- \
                --replication-policy=automatic \
                --project="$GCP_PROJECT_ID"
            fi
          }

          for name in SECRET_KEY_BASE POSTGRES_HOST POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            upsert_secret "$name" "${!name}"
          done

          # setIamPolicy は Secret Admin 等が必要。権限が無い場合はスキップする。
          # 初回はプロジェクト Owner が実行 SA に secretAccessor を付与すること。
          RUNTIME_SA="$(gcloud config get-value account)"
          if [[ -z "$RUNTIME_SA" || "$RUNTIME_SA" == "(unset)" ]]; then
            echo "Could not resolve runtime service account from gcloud auth" >&2
            exit 1
          fi

          for name in SECRET_KEY_BASE POSTGRES_HOST POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD; do
            if ! gcloud secrets add-iam-policy-binding "$name" \
              --member="serviceAccount:${RUNTIME_SA}" \
              --role="roles/secretmanager.secretAccessor" \
              --project="$GCP_PROJECT_ID" \
              --quiet; then
              echo "::warning::Failed to bind secretAccessor on $name for $RUNTIME_SA. Grant it once as project Owner if Cloud Run cannot read secrets."
            fi
          done

      - name: Deploy to Cloud Run
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          gcloud run deploy rails-api \
            --image=$IMAGE \
            --region=asia-northeast1 \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --network-tags=cloudrun-rails-api \
            --max-instances=10 \
            --min-instances=0 \
            --cpu=1 \
            --memory=512Mi \
            --set-env-vars="RAILS_ENV=production,POSTGRES_PORT=5432,RAILS_MAX_THREADS=5" \
            --set-secrets="SECRET_KEY_BASE=SECRET_KEY_BASE:latest,POSTGRES_HOST=POSTGRES_HOST:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --project="${{ secrets.GCP_PROJECT_ID }}"

      - name: Run database prepare
        env:
          IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/rails-api/rails-api:latest
        run: |
          gcloud run jobs deploy rails-api-prepare \
            --image="$IMAGE" \
            --region=asia-northeast1 \
            --network=default \
            --subnet=default \
            --vpc-egress=private-ranges-only \
            --command=bundle \
            --args=exec,rails,db:prepare \
            --set-env-vars="RAILS_ENV=production,POSTGRES_PORT=5432" \
            --set-secrets="SECRET_KEY_BASE=SECRET_KEY_BASE:latest,POSTGRES_HOST=POSTGRES_HOST:latest,POSTGRES_DB=POSTGRES_DB:latest,POSTGRES_USER=POSTGRES_USER:latest,POSTGRES_PASSWORD=POSTGRES_PASSWORD:latest" \
            --tasks=1 \
            --max-retries=1 \
            --project="${{ secrets.GCP_PROJECT_ID }}"

          gcloud run jobs execute rails-api-prepare \
            --region=asia-northeast1 \
            --wait \
            --project="${{ secrets.GCP_PROJECT_ID }}"
